<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
:root{--red:#EB0A1E;--red-d:#C00010;--bg:#F5F7FA;--sw:230px}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow-x:hidden}
body{font-family:'Inter',sans-serif;background:var(--bg);color:#111;font-size:14px}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-thumb{background:#ddd;border-radius:4px}

/* ── SHELL: mobile = stacked, desktop = side-by-side ── */
.shell{display:flex;min-height:100vh;position:relative}

/* Sidebar overlay backdrop (mobile) */
.sb-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:39;backdrop-filter:blur(2px)}
.sb-backdrop.open{display:block}

/* Sidebar */
.sidebar{
  width:var(--sw);background:#fff;border-right:1px solid #f0f0f0;
  display:flex;flex-direction:column;flex-shrink:0;
  height:100vh;overflow-y:auto;overflow-x:hidden;
  /* Mobile: hidden off-screen by default */
  position:fixed;top:0;left:0;z-index:40;
  transform:translateX(-100%);transition:transform .28s cubic-bezier(.4,0,.2,1);
}
.sidebar.open{transform:translateX(0);box-shadow:8px 0 32px rgba(0,0,0,.18)}

/* Desktop: sidebar always visible, not fixed */
@media(min-width:768px){
  .sidebar{position:sticky;transform:none !important;box-shadow:none}
  .sb-backdrop{display:none !important}
}

/* Content area always takes full width on mobile */
.content{flex:1;display:flex;flex-direction:column;min-width:0;width:100%;overflow-x:hidden;max-width:100vw}
/* Header */
header{background:#fff;border-bottom:1px solid #f0f0f0;padding:10px 14px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:20;box-shadow:0 1px 3px rgba(0,0,0,.05);width:100%;max-width:100vw}

/* Header items hidden on mobile */
.hdr-hide-mob{display:none}
@media(min-width:600px){.hdr-hide-mob{display:flex;align-items:center}}

/* Main padding responsive */
.main-pad{padding:10px;overflow-x:hidden}
@media(min-width:500px){.main-pad{padding:14px}}
@media(min-width:768px){.main-pad{padding:18px 22px}}

/* KPI grid: 2 cols mobile, 4 cols desktop */
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
@media(min-width:768px){.kpi-grid{grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}}

/* Dashboard main row: stacked mobile, 3-col desktop */
.dash-row{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:12px}
@media(min-width:900px){.dash-row{grid-template-columns:1fr 340px;gap:16px;margin-bottom:16px}}

/* Donut row: stacked mobile, 2-col desktop */
.donut-row{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:700px){.donut-row{grid-template-columns:1fr 1fr;gap:14px}}

/* Analytics 6-kpi row */
.akpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
@media(min-width:900px){.akpi-grid{grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:18px}}

/* Analytics chart rows */
.a-row1{display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:14px}
@media(min-width:900px){.a-row1{grid-template-columns:1fr 280px 1fr;gap:14px}}
.a-row2{display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:14px}
@media(min-width:900px){.a-row2{grid-template-columns:1fr 1fr 340px;gap:14px}}
.a-row3{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:900px){.a-row3{grid-template-columns:1fr 280px 280px;gap:14px}}

/* Reports grid */
.rep-sum{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
@media(min-width:700px){.rep-sum{grid-template-columns:repeat(4,1fr)}}
.rep-row{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:900px){.rep-row{grid-template-columns:1fr 260px;gap:16px}}

/* Add Activity grid */
.add-grid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:700px){.add-grid{grid-template-columns:1fr 1fr;gap:20px}}

/* Table overflow */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* Cards */
.kpi{background:#fff;border-radius:12px;padding:11px 13px;border:1px solid #f0f0f0;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.card{background:#fff;border-radius:12px;padding:13px 15px;border:1px solid #f0f0f0;box-shadow:0 1px 4px rgba(0,0,0,.05)}
@media(min-width:600px){.kpi,.card{border-radius:16px;padding:16px 20px}}

/* Nav */
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:10px;font-size:13px;font-weight:500;cursor:pointer;width:100%;border:none;background:none;color:#5a6478;transition:all .15s;text-align:left}
.nav-item:hover{background:#f5f5f5;color:#111}
.nav-item.active{background:#EB0A1E;color:#fff}
.nav-item.active .nav-icon{color:#fff}
.nav-sub{display:flex;align-items:center;gap:8px;padding:7px 14px 7px 36px;border-radius:8px;font-size:12.5px;font-weight:500;cursor:pointer;width:100%;border:none;background:none;color:#7c8493;transition:all .15s;text-align:left}
.nav-sub:hover{background:#f5f5f5;color:#111}
.nav-sub.active{color:#EB0A1E;font-weight:600;background:#fff5f5}
.nav-icon{width:17px;height:17px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}

/* Badges */
.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:10.5px;font-weight:600;letter-spacing:.2px;white-space:nowrap}
.b-sub{background:#EFF6FF;color:#2563EB}.b-appr{background:#F0FDF4;color:#16A34A}.b-rej{background:#FFF1F2;color:#E11D48}.b-draft{background:#F9FAFB;color:#6B7280}.b-pend{background:#FFFBEB;color:#D97706}

/* Buttons */
.btn-red{background:#EB0A1E;color:#fff;border:none;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;transition:background .2s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn-red:hover{background:#C00010}
.btn-outline{background:#fff;color:#374151;border:1.5px solid #e5e7eb;padding:8px 16px;border-radius:10px;font-size:12.5px;font-weight:500;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.btn-outline:hover{border-color:#EB0A1E;color:#EB0A1E}

/* Form inputs */
input,select,textarea{font-family:'Inter',sans-serif}
/* ── AUTOFILL BLACK TEXT OVERRIDE (all browsers, all Android versions) ── */
input:-webkit-autofill{ -webkit-text-fill-color:#111 !important; color:#111 !important; -webkit-box-shadow:0 0 0 1000px #ffffff inset !important; box-shadow:0 0 0 1000px #ffffff inset !important; transition:background-color 99999s ease 0s,color 99999s ease 0s !important; caret-color:#111 !important }
input:-webkit-autofill:hover{ -webkit-text-fill-color:#111 !important; -webkit-box-shadow:0 0 0 1000px #ffffff inset !important }
input:-webkit-autofill:focus{ -webkit-text-fill-color:#111 !important; -webkit-box-shadow:0 0 0 1000px #ffffff inset !important }
input:-webkit-autofill:active{ -webkit-text-fill-color:#111 !important; -webkit-box-shadow:0 0 0 1000px #ffffff inset !important }
input{ color:#111 !important; -webkit-text-fill-color:#111 !important; caret-color:#111 !important }
input::placeholder{ color:#9ca3af !important; -webkit-text-fill-color:#9ca3af !important; opacity:1 }
.lp{ color:#111 !important; -webkit-text-fill-color:#111 !important; caret-color:#111 !important }
.inp{width:100%;border:1.5px solid #e5e7eb;border-radius:10px;padding:9px 13px;font-size:13px;outline:none;transition:border .15s;background:#fff}
.inp:focus{border-color:#EB0A1E;box-shadow:0 0 0 3px rgba(235,10,30,.08)}
select.inp{cursor:pointer}

/* Tag chips */
.tag{display:inline-flex;align-items:center;padding:4px 10px;border-radius:20px;font-size:11.5px;font-weight:600;cursor:pointer;border:1.5px solid}
.tag.sel{background:#EB0A1E;color:#fff;border-color:#EB0A1E}
.tag.unsel{background:#fff;color:#5a6478;border-color:#e5e7eb}
.tag.unsel:hover{border-color:#EB0A1E;color:#EB0A1E}

/* Photo thumb */
.photo-thumb{width:100%;aspect-ratio:4/3;border-radius:8px;object-fit:cover;border:2px solid #f0f0f0}

/* Animations */
.live-dot{width:7px;height:7px;background:#22c55e;border-radius:50%;animation:blink 1.5s ease infinite;display:inline-block}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.flash{animation:flashCard .7s ease}
@keyframes flashCard{0%{background:#fff}30%{background:#f0fdf4}100%{background:#fff}}
.count-up{animation:countAnim .4s ease}
@keyframes countAnim{from{opacity:.3;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
.slide-in{animation:slideIn .4s ease}
@keyframes slideIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
.toast{position:fixed;bottom:16px;right:12px;left:12px;z-index:9999;background:#1e1e2e;color:#fff;padding:12px 16px;border-radius:12px;font-size:12.5px;font-weight:500;box-shadow:0 8px 32px rgba(0,0,0,.3);animation:toastIn .3s ease;display:flex;align-items:center;gap:10px;max-width:400px}
@media(min-width:500px){.toast{left:auto;right:20px;bottom:20px;max-width:340px}}
@keyframes toastIn{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
</style>
</head>

function today(){return new Date().toISOString().split('T')[0]}
function fmtINR(n){if(n>=10000000)return'₹'+(n/10000000).toFixed(2)+'Cr';if(n>=100000)return'₹'+(n/100000).toFixed(2)+'L';return'₹'+n.toLocaleString('en-IN')}

/* ══ ETBR AGGREGATOR (used by dashboard, analytics, reports) ══ */
function etbrOf(acts){
  const E=acts.reduce((s,a)=>s+(a.etbr?.enquiry||0),0)
  const T=acts.reduce((s,a)=>s+(a.etbr?.td||0),0)
  const B=acts.reduce((s,a)=>s+(a.etbr?.booking||0),0)
  const R=acts.reduce((s,a)=>s+(a.etbr?.retailed||0),0)
  const spend=acts.reduce((s,a)=>s+(a.spend||0),0)
  const pct=(a,b)=>b>0?((a/b)*100).toFixed(1)+'%':'—'
  const costPer=(v)=>v>0&&spend>0?fmtINR(Math.round(spend/v)):'—'
  return {
    E,T,B,R,spend,
    etConv:pct(T,E),   // Enquiry→TD
    tbConv:pct(B,T),   // TD→Booking
    brConv:pct(R,B),   // Booking→Retail
    erConv:pct(R,E),   // End-to-end
    cpe:costPer(E),    // Cost per Enquiry
    cpt:costPer(T),    // Cost per TD
    cpb:costPer(B),    // Cost per Booking
    cpr:costPer(R),    // Cost per Retail
    actCount:acts.length,
  }
}

/* ══ ETBR FUNNEL HTML (reusable card) ══ */

        <span style="font-size:9px;color:#9ca3af">${s.code}</span>
      </div>`).join('')}

    <p style="text-align:center;font-size:10.5px;color:#7c3aed;font-weight:700;margin-top:4px">E→R: ${erConv}</p>`

  return `<div style="display:flex;flex-direction:column;gap:0">
    ${stages.map((s,i)=>`
      <!-- Stage row -->
      <div style="display:flex;align-items:center;gap:10px;padding:8px 0">
        <!-- Code badge -->
        <div style="width:30px;height:30px;background:${s.bg};border:1.5px solid ${s.bc};border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0">
          <span style="font-size:11px;font-weight:800;color:${s.color}">${s.code}</span>
        </div>
        <!-- Label + bar -->
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
            <span style="font-size:11.5px;font-weight:600;color:#374151">${s.label}</span>
            <span style="font-size:15px;font-weight:800;color:${s.color}">${s.val}</span>
          </div>

        </div>
      </div>
      <!-- Conversion arrow between stages -->
      ${s.nextConv?`<div style="display:flex;align-items:center;gap:8px;padding:0 0 0 40px">
        <div style="width:1px;height:14px;background:#e5e7eb;flex-shrink:0;margin-left:14px"></div>
        <div style="display:flex;align-items:center;gap:6px">
          <svg viewBox="0 0 20 20" fill="${stages[i+1].color}" width="12" height="12"><path fill-rule="evenodd" d="M16.707 10.293a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-5.293-5.293a1 1 0 011.414-1.414l6 6z"/></svg>
          <span style="font-size:11px;font-weight:700;color:${stages[i+1].color};background:${stages[i+1].bg};padding:2px 8px;border-radius:6px;border:1px solid ${stages[i+1].bc}">${s.code}→${stages[i+1].code}: ${s.nextConv}</span>
        </div>
      </div>`:''}
    `).join('')}

    <!-- End-to-end summary -->
    <div style="margin-top:10px;background:linear-gradient(135deg,#f5f3ff,#ede9fe);border-radius:10px;padding:11px 14px;display:flex;align-items:center;justify-content:space-between;border:1.5px solid #ddd6fe">
      <div>
        <p style="font-size:11px;font-weight:700;color:#7c3aed">End-to-End (E → R)</p>

function doLogin(lid,pwd){
  const matches=window.AUTH_USERS.filter(x=>x.login_id===lid)
  if(!matches.length){showErr('login-err','Invalid Login ID');return}
  if(matches[0].password&&pwd&&matches[0].password!==pwd){showErr('login-err','Incorrect password');return}
  const order=['admin','manager','fsm','dealer_pic']
  const u=matches.sort((a,b)=>order.indexOf(a.role)-order.indexOf(b.role))[0]
  S.user={...u}; localStorage.setItem('dt_u',JSON.stringify({...u}))
  // Start sync immediately for ALL roles on login
  setTimeout(()=>{ try{initSupabaseSync()}catch(e){} }, 200)
  nav('dashboard','overview')
}
function logout(){S.user=null;S.simRunning=false;Object.values(S.charts).forEach(c=>c&&c.destroy&&c.destroy());S.charts={};localStorage.removeItem('dt_u');nav('login')}

function liveInject(act){
  S.activities.unshift(act); S.kpis.total++; S.kpis.spend+=act.spend; S.notif++
  const nb=document.getElementById('notif-cnt')
  if(nb){nb.textContent=S.notif;nb.classList.add('flash');setTimeout(()=>nb.classList.remove('flash'),700)}
  // KPI flash
  ;['kpi-0','kpi-1'].forEach(id=>{const e=document.getElementById(id);if(e){e.classList.add('flash');setTimeout(()=>e.classList.remove('flash'),700)}})
  animNum('kpi-v-0',S.kpis.total-1,S.kpis.total)
  const ev=document.getElementById('kpi-v-1');if(ev){ev.textContent=fmtINR(S.kpis.spend);ev.classList.add('count-up');setTimeout(()=>ev.classList.remove('count-up'),400)}
  // Feed
  const feed=document.getElementById('act-feed')
  if(feed){
    const row=document.createElement('div')
    row.className='flex items-start gap-3 slide-in'
    row.innerHTML=actFeedRow(act)
    feed.insertBefore(row,feed.firstChild)
    const all=[...feed.querySelectorAll(':scope>div')]
    if(all.length>5) all[all.length-1].remove()
  }
  updateLiveCharts(act)
  if(act.date>=DF.from && act.date<=DF.to && (!DF.dealer||act.did===DF.dealer)){
    setTimeout(()=>{ refreshDashboard(); updateFilterInfo() },200)
  }
  toast(`<b>${act.dealer}</b>: ${act.cat} submitted — ${fmtINR(act.spend)}`,act.color)
}

function animNum(id,from,to){
  const el=document.getElementById(id); if(!el) return
  const s=performance.now()
  function step(now){
    const p=Math.min((now-s)/400,1); el.textContent=Math.round(from+(to-from)*p)
    if(p<1) requestAnimationFrame(step)
    else el.classList.add('count-up')
  }
  requestAnimationFrame(step)
}

function updateLiveCharts(act){
  const oc=S.charts.overview
  if(oc){const ci=CATS.findIndex(c=>c.name===act.cat);if(ci>=0){oc.data.datasets[ci].data[6]++;oc.update('active')}}
  const ac=S.charts.topAct
  if(ac){const i=ac.data.labels.indexOf(act.cat);if(i>=0){ac.data.datasets[0].data[i]++;ac.update()}}
  const dc=S.charts.dealerBar
  if(dc){const i=DEALERS.findIndex(d=>d.id===act.did);if(i>=0){dc.data.datasets[0].data[i]++;dc.update()}}
}

/* ═══════════════ TOAST ═══════════════ */
function toast(msg,accent='#EB0A1E'){
  const c=document.getElementById('toasts')
  const t=document.createElement('div'); t.className='toast'
  t.style.borderLeft=`3px solid ${accent}`
  t.innerHTML=`<span class="live-dot" style="background:${accent};flex-shrink:0"></span><span>${msg}</span>`
  c.appendChild(t)
  setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),300)},4500)
}

/* ═══════════════ RENDER DISPATCH ═══════════════ */
function render(){
  const app=document.getElementById('app')
  if(!S.user||S.page==='login'){
    app.innerHTML=renderLogin()
    // Restore brand logo — DOM element now exists
    restoreBrandLogo()
    // Run multiple times — Android Chrome fires autofill color up to 800ms after render
    setTimeout(restoreRemembered,60)
    setTimeout(forceBlackInputs,400)
    setTimeout(forceBlackInputs,900)
    return
  }
  const PAGES={
    dashboard:renderDashboard, activities:renderActivities, reports:renderReports,
    analytics:renderAnalytics, settings:renderSettings,
  }
  const fn=PAGES[S.page]||renderDashboard
  app.innerHTML=fn()
  setTimeout(()=>{
    if(S.page==='dashboard'){initDashCharts();startSim()}
    if(S.page==='analytics') initAnalytics()
    if(S.page==='reports') setTimeout(refreshReports,80)
    if(S.page==='activities'&&S.sub==='list') setTimeout(()=>updateGFInfo('actlist'),80)
    if(S.page==='settings'&&S.sub&&S.sub!=='general') setTimeout(()=>stSnapshot(S.sub),60)
  },60)
}

  updateGFInfo(pageId)

function setGFPreset(days, pageId){
  const to=new Date(), from=new Date()
  from.setDate(from.getDate()-(days>0?days-1:0))
  GF.from=from.toISOString().split('T')[0]
  GF.to=to.toISOString().split('T')[0]
  const f=document.getElementById(pageId+'-from'), t=document.getElementById(pageId+'-to')
  if(f) f.value=GF.from; if(t) t.value=GF.to
  applyGF(pageId)
}

function updateGFInfo(pageId){
  const el=document.getElementById(pageId+'-filter-info'); if(!el) return
  const acts=getGFActs()
  const fmtD=d=>new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})
  const dateStr=GF.from===GF.to?fmtD(GF.from):new Date(GF.from).toLocaleDateString('en-IN',{day:'2-digit',month:'short'})+' → '+fmtD(GF.to)
  const dlr=GF.dealer?(DEALERS.find(d=>d.id===GF.dealer)?.name||''):'All Dealers'
  el.innerHTML=`<b>${acts.length}</b> activit${acts.length===1?'y':'ies'} &nbsp;·&nbsp; ${dateStr} &nbsp;·&nbsp; ${dlr}`
}

function getGFActs(){
  const u=S.user
  const isDlr=u&&u.role==='dealer_pic'
  const isFsm=u&&u.role==='fsm'

  // Build FSM's full dealer list (they can be assigned to multiple dealers)
  let fsmDealerIds=[]
  if(isFsm){
    // Find all entries in AUTH_USERS for this login_id — each may have a different dealer
    fsmDealerIds=window.AUTH_USERS
      .filter(x=>x.login_id===u.login_id&&x.role==='fsm'&&x.dealer_id)
      .map(x=>x.dealer_id)
    if(!fsmDealerIds.includes(u.dealer_id)&&u.dealer_id) fsmDealerIds.push(u.dealer_id)
  }

  return S.activities.filter(a=>{
    // Dealer PIC sees only their dealer
    if(isDlr&&a.did!==u.dealer_id) return false
    // FSM sees all their assigned dealers
    if(isFsm&&fsmDealerIds.length>0&&!fsmDealerIds.includes(a.did)) return false
    // Date filter
    if(GF.from&&a.date<GF.from) return false
    if(GF.to&&a.date>GF.to) return false
    // Dealer filter (admin/manager UI filter)
    if(GF.dealer&&a.did!==GF.dealer) return false
    return true
  })
}

function refreshDashboard(){
  const acts=getFilteredActs()
  const total=acts.length
  const spend=acts.reduce((s,a)=>s+(a.spend||0),0)

  const dealers=[...new Set(acts.map(a=>a.did))].length

  // Show/hide empty state
  const emptyEl=document.getElementById('dash-empty-state')
  const mainEl=document.getElementById('dash-main-content')
  if(emptyEl) emptyEl.style.display=total===0?'block':'none'
  if(mainEl)  mainEl.style.display=total===0?'none':''
  if(total===0) return // nothing else to render
  const v0=document.getElementById('kpi-v-0'), v1=document.getElementById('kpi-v-1')
  const v2=document.getElementById('kpi-v-2')
  if(v0){v0.textContent=total;v0.classList.add('count-up');setTimeout(()=>v0.classList.remove('count-up'),400)}
  if(v1){v1.textContent=fmtINR(spend);v1.classList.add('count-up');setTimeout(()=>v1.classList.remove('count-up'),400)}
  if(v2){v2.textContent=dealers;v2.classList.add('count-up');setTimeout(()=>v2.classList.remove('count-up'),400)}

  // KPI card flash
  ;['kpi-0','kpi-1','kpi-2'].forEach(id=>{
    const el=document.getElementById(id)
    if(el){el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),700)}
  })

  // Update ETBR intelligence row
  const eb=etbrOf(acts)
  ;[['dash-E',eb.E,'#16a34a'],['dash-T',eb.T,'#2563eb'],['dash-B',eb.B,'#EB0A1E'],['dash-R',eb.R,'#7c3aed']].forEach(([id,v,c])=>{
    const el=document.getElementById(id); if(el){el.textContent=v;el.style.color=c}
  })

  // Funnel
  const funnel=document.getElementById('dash-funnel-bars')
  if(funnel) funnel.innerHTML=etbrFunnelHTML(eb,false)

  // Cost intelligence table
  const costTbl=document.getElementById('dash-cost-table')
  if(costTbl) costTbl.innerHTML=`<div style="display:flex;flex-direction:column;gap:7px">
    ${[
      ['Cost / Enquiry',    eb.cpe,    '#16a34a','#f0fdf4'],
      ['Cost / Test Drive', eb.cpt,    '#2563eb','#eff6ff'],
      ['Cost / Booking',    eb.cpb,    '#EB0A1E','#fff1f2'],
      ['Cost / Retail',     eb.cpr,    '#7c3aed','#f5f3ff'],
      ['E→T Conv.',         eb.etConv, '#2563eb','#eff6ff'],
      ['T→B Conv.',         eb.tbConv, '#EB0A1E','#fff1f2'],
      ['B→R Conv.',         eb.brConv, '#7c3aed','#f5f3ff'],
      ['End-to-End (E→R)',  eb.erConv, '#7c3aed','#f5f3ff'],
    ].map(([l,v,c,bg])=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 10px;background:${bg};border-radius:8px">
      <span style="font-size:11px;color:#6b7280;font-weight:500">${l}</span>
      <span style="font-size:13px;font-weight:800;color:${c}">${v}</span>
    </div>`).join('')}
  </div>`

  // Update activity feed
  const feed=document.getElementById('act-feed')
  if(feed){
    feed.innerHTML = acts.slice(0,5).map(a=>`<div style="display:flex;align-items:flex-start;gap:8px">${actFeedRow(a)}</div>`).join('')
    if(acts.length===0) feed.innerHTML=`<div style="text-align:center;padding:20px 0;color:#d1d5db;font-size:13px">No activities in selected range</div>`
  }

  // Update overview chart — always rolling last 7 days
  const oc=S.charts.overview
  if(oc){
    const days7=Array.from({length:7},(_,i)=>{
      const d=new Date(); d.setDate(d.getDate()-6+i)
      return d.toISOString().split('T')[0]
    })
    const allActs=S.activities // use all activities for 7-day window (not date-filtered)
    oc.data.labels=days7.map(d=>new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short'}))
    if(oc.data.datasets[0]) oc.data.datasets[0].data=days7.map(day=>allActs.filter(a=>a.date===day).length)
    oc.update()
    setTimeout(refreshOverviewChart, 50)
  }

  // Update sparklines with rolling last-7-days from ALL activities (not date-filtered)
  const days7iso=Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return d.toISOString().split('T')[0]})
  const allActs=S.activities
  const spData=[
    days7iso.map(d=>allActs.filter(a=>a.date===d).length),
    days7iso.map(d=>allActs.filter(a=>a.date===d).reduce((s,a)=>s+(a.spend||0),0)),
    days7iso.map(d=>[...new Set(allActs.filter(a=>a.date===d).map(a=>a.did))].length),
  ]
  spData.forEach((data,i)=>{
    const sp=S.charts[`sp${i}`]; if(!sp?.data?.datasets?.[0]) return
    sp.data.datasets[0].data=data
    sp.update('none')
  })

  // Update dealer bar
  const dc=S.charts.dealerBar
  if(dc){
    dc.data.datasets[0].data=DEALERS.map(d=>acts.filter(a=>a.did===d.id).length)
    dc.update()
  }

  // Update top activities donut
  const ac=S.charts.topAct
  if(ac){
    const catCounts=CATS.map(c=>acts.filter(a=>a.cat===c.name).length)
    ac.data.datasets[0].data=catCounts
    ac.update()
    const tot=catCounts.reduce((s,v)=>s+v,0)||1
    renderLegendTop5('leg-act',CATS.map(c=>c.name),catCounts,CATS.map(c=>c.color),tot)
    const ctrEl=document.getElementById('donut-act-total')
    if(ctrEl) ctrEl.textContent=total
  }

  // Update top models donut
  const mc=S.charts.topMod
  if(mc){
    const MOD_COLORS=['#EB0A1E','#3b82f6','#22c55e','#f59e0b','#a855f7','#6366f1','#06b6d4','#84cc16','#f97316','#ec4899','#8b5cf6']

    const hasData=modCounts.some(v=>v>0)
    mc.data.datasets[0].data=hasData?modCounts:[1]
    mc.data.labels=hasData?MODELS:['No Data']
    mc.data.datasets[0].backgroundColor=hasData?MOD_COLORS:['#e5e7eb']
    mc.update()
    if(hasData){
      renderLegendTop5('leg-mod',MODELS,modCounts,MOD_COLORS,modCounts.reduce((s,v)=>s+v,0)||1)
    } else {
      const mlegEl=document.getElementById('leg-mod')
      if(mlegEl) mlegEl.innerHTML='<p style="font-size:11px;color:#d1d5db;text-align:center;margin-top:12px">No model data yet</p>'
    }
  }

  // Show result count toast
  showToast(`📅 Showing ${total} activit${total===1?'y':'ies'} · ${DF.from===DF.to?DF.from:DF.from+' → '+DF.to}`,'#3b82f6')
}

function dateDaysArray(from,to){
  const days=[]
  const d=new Date(from)
  const end=new Date(to)
  while(d<=end){days.push(d.toISOString().split('T')[0]);d.setDate(d.getDate()+1)}
  return days.length>30?days.filter((_,i)=>i%Math.ceil(days.length/30)===0):days
}

function setPreset(days){
  const to=new Date()
  const from=new Date()
  from.setDate(from.getDate()-(days>0?days-1:0))
  GF.from=from.toISOString().split('T')[0]
  GF.to=to.toISOString().split('T')[0]
  const f=document.getElementById('df-from'), t=document.getElementById('df-to')
  if(f) f.value=GF.from
  if(t) t.value=GF.to
  applyDateFilter()
}

/* ═══════════════ DASH CHARTS ═══════════════ */
function initDashCharts(){
  const cfg=(c,d,fil)=>({type:'line',data:{labels:DATES7,datasets:[{data:d,borderColor:c,backgroundColor:c+(fil?'22':'00'),tension:.45,fill:fil,borderWidth:2,pointRadius:0}]},options:{plugins:{legend:{display:false}},scales:{x:{display:false},y:{display:false}},animation:{duration:300}}})
  ;[['#EB0A1E',true,0],['#22c55e',true,1],['#f59e0b',false,2],['#3b82f6',false,3]].forEach(([c,f,i])=>{
    const el=document.getElementById(`spark-${i}`); if(!el) return
    S.charts[`sp${i}`]=new Chart(el,cfg(c,Array.from({length:7},()=>0),f))
  })
  const oel=document.getElementById('chart-overview'); if(!oel) return
  S.charts.overview=new Chart(oel,{type:'line',
    data:{labels:DATES7,datasets:[{
      label:'Activities',
      borderColor:'#EB0A1E',
      backgroundColor:'rgba(235,10,30,.08)',
      data:Array.from({length:7},()=>0),
      tension:.4,fill:true,borderWidth:2.5,
      pointRadius:4,pointBackgroundColor:'#EB0A1E',
      pointBorderColor:'#fff',pointBorderWidth:2
    }]},
    options:{responsive:true,maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      plugins:{
        legend:{display:false},
        tooltip:{
          callbacks:{
            title:items=>`${items[0].label}`,
            label:item=>`  Activities: ${item.parsed.y}`,
          },
          backgroundColor:'#111',
          titleColor:'#9ca3af',
          bodyColor:'#fff',
          borderColor:'#333',
          borderWidth:1,
          padding:10,
          cornerRadius:8,
        }
      },
      scales:{
        x:{grid:{display:false},ticks:{font:{size:10},color:'#9ca3af',maxRotation:0}},
        y:{grid:{color:'#f8f8f8'},ticks:{font:{size:10},color:'#9ca3af'},beginAtZero:true,precision:0}
      }
    }})
  const del=document.getElementById('chart-dealer-bar'); if(!del) return
  S.charts.dealerBar=new Chart(del,{type:'bar',
    data:{labels:DEALERS.map(d=>d.name.replace(' TOYOTA','')),datasets:[{data:[0,0,0,0,0],backgroundColor:'#EB0A1E',borderRadius:6,label:'Activities'}]},
    options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{display:false}},
      scales:{x:{grid:{display:false},ticks:{font:{size:10}},beginAtZero:true,precision:0},y:{grid:{display:false},ticks:{font:{size:10}}}}}})
  function donut(id,labels,data,colors){
    const el=document.getElementById(id); if(!el) return null
    return new Chart(el,{type:'doughnut',data:{labels,datasets:[{data,backgroundColor:colors,borderWidth:2,borderColor:'#fff'}]},
      options:{cutout:'65%',plugins:{legend:{display:false},tooltip:{callbacks:{
          title:i=>`${i[0].label}`,
          label:i=>`  ${i.parsed}`,
          labelColor:i=>({backgroundColor:i.dataset.backgroundColor[i.dataIndex]||'#EB0A1E',borderColor:'transparent'})
        },backgroundColor:'#111',titleColor:'#9ca3af',bodyColor:'#fff',padding:8,cornerRadius:8}}}})
  }
  S.charts.topAct=donut('chart-top-act',CATS.map(c=>c.name),[1,1,1,1,1],CATS.map(c=>c.color))
  S.charts.topMod=donut('chart-top-mod',['No Data'],[1],['#e5e7eb'])
  // Auto-run filter on init
  setTimeout(()=>{ refreshDashboard(); updateFilterInfo() },100)
}

function updateFilterInfo(){
  const el=document.getElementById('filter-info-text'); if(!el) return
  const acts=getFilteredActs()
  const same=DF.from===DF.to
  const fmtD=d=>new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})
  const dateStr=same?fmtD(DF.from):`${new Date(DF.from).toLocaleDateString('en-IN',{day:'2-digit',month:'short'})} → ${fmtD(DF.to)}`
  const dealerName=DF.dealer?(DEALERS.find(d=>d.id===DF.dealer)?.name||''):'All Dealers'
  el.innerHTML=`<b>${acts.length}</b> activit${acts.length===1?'y':'ies'} &nbsp;·&nbsp; ${dateStr} &nbsp;·&nbsp; ${dealerName}`
}

  return `<tr id="row-${a.id}" style="border-bottom:1px solid #f9fafb;transition:background .12s"

function filterActList(){
  const dealer=GF.dealer||(document.getElementById('flt-dealer')?.value||'')
  const cat=document.getElementById('flt-cat')?.value||''
  const status=document.getElementById('flt-status')?.value||''
  const u=S.user
  const isDlr=u.role==='dealer_pic'
  const isFsm=u.role==='fsm'
  const isAdmin=u.role==='admin'||u.role==='manager'
  const filtered=S.activities.filter(a=>{
    // Role-based hard restrictions
    if(isDlr&&a.did!==u.dealer_id) return false
    if(isFsm&&u.dealer_id&&a.did!==u.dealer_id) return false
    // UI filters (only admin/manager can change dealer filter)
    if(GF.dealer&&a.did!==GF.dealer) return false
    if(cat&&a.cat!==cat) return false
    if(status&&a.status!==status) return false
    if(GF.from&&a.date<GF.from) return false
    if(GF.to&&a.date>GF.to) return false
    return true
  })
  const tbody=document.getElementById('act-tbody'); if(!tbody) return
  tbody.innerHTML=filtered.map((a,i)=>actTableRow(a,i,isDlr,isAdmin)).join('')
  if(filtered.length===0) tbody.innerHTML=`<tr><td colspan="9" style="text-align:center;padding:40px;color:#d1d5db;font-size:13px">No activities match the filter</td></tr>`
  const cnt=document.getElementById('act-count')
  if(cnt) cnt.textContent=filtered.length+' activities'
  const show=document.getElementById('act-showing')
  if(show) show.textContent=`Showing ${filtered.length} entries`
}

function resetActFilters(){
  const d=document.getElementById('flt-dealer')
  const c=document.getElementById('flt-cat')
  const s=document.getElementById('flt-status')
  if(d) d.value=''; if(c) c.value=''; if(s) s.value=''
  filterActList()
}

function dlActListExcel(){
  if(passkeyGuard()) return
  try{
    if(typeof XLSX==='undefined') throw new Error('SheetJS not loaded')
    // Get currently filtered rows from the visible table
    const rows=[...document.querySelectorAll('#act-tbody tr[id^="row-"]')]
    const actIds=rows.map(r=>r.id.replace('row-',''))
    const filteredActs=actIds.map(id=>S.activities.find(a=>a.id===id)).filter(Boolean)

    if(!filteredActs.length){ toast('No activities to export','#9ca3af'); return }

    const wb=XLSX.utils.book_new()
    const u=S.user
    const meta=[
      ['DealerTrack — Activity List Export'],
      ['Exported By:', u.name||'—', 'Role:', u.role||'—'],
      ['Period:', GF.from+' to '+GF.to],
      ['Dealer Filter:', GF.dealer?(DEALERS.find(d=>d.id===GF.dealer)?.name||'All'):'All Dealers'],
      ['Total Records:', filteredActs.length],
      ['Generated:', new Date().toLocaleString('en-IN')],
      ['']
    ]

    const hdr=['#','Plan ID','Activity','Dealer','Region','Category','Mkt Type','Start Date','End Date','Days',
               'Total Cost (₹)','TKM Share (₹)','Dealer Share (₹)',
               'Enquiry (E)','Test Drive (T)','Booking (B)','Retail (R)','E→R Conv%',
               'Models Tagged','Status','Added By','Added At']

    const dataRows=filteredActs.map((a,i)=>{
      const dlr=DEALERS.find(d=>d.id===a.did)
      const E=a.etbr?.enquiry||0, T=a.etbr?.td||0, B=a.etbr?.booking||0, R=a.etbr?.retailed||0
      const conv=E>0?Math.round(R/E*100)+'%':'—'
      return [
        i+1,
        a.plan_id||'—',
        a.title||a.cat,
        a.dealer,
        dlr?.region||'—',
        a.cat,
        a.mkt_type||'—',
        a.start_date||a.date,
        a.end_date||a.date,
        a.days||1,
        a.spend||0,
        a.tkm_share||0,
        a.dlr_share||0,
        E, T, B, R, conv,
        Array.isArray(a.models)?a.models.join(', '):'—',
        a.status,
        a.added_by||'—',
        a.added_at?new Date(a.added_at).toLocaleString('en-IN'):'—',
      ]
    })

    const ws=XLSX.utils.aoa_to_sheet([...meta, hdr, ...dataRows])
    ws['!cols']=[
      {wch:4},{wch:16},{wch:28},{wch:20},{wch:10},{wch:22},{wch:8},{wch:12},{wch:12},{wch:5},
      {wch:14},{wch:14},{wch:14},
      {wch:8},{wch:8},{wch:8},{wch:8},{wch:10},
      {wch:24},{wch:12},{wch:18},{wch:20}
    ]
    ws['!freeze']={xSplit:0,ySplit:meta.length+1}
    XLSX.utils.book_append_sheet(wb, ws, 'Activities')

    const fname=('DealerTrack_Activities_'+GF.from+'_to_'+GF.to+(GF.dealer?'_'+(DEALERS.find(d=>d.id===GF.dealer)?.short||''):''))
      .replace(/[^a-zA-Z0-9_\-]/g,'_')
    XLSX.writeFile(wb, fname+'.xlsx')
    toast(`✅ Excel exported — ${filteredActs.length} activities`,'#22c55e')
  }catch(e){ toast('⚠️ Export failed: '+e.message,'#f59e0b') }
}

let _sbPollTimer=null
let _sbLastSync=0

function initSupabaseSync(){
  sbLoadAll()       // immediate full load on connect
  _startSbPolling() // then poll every 30s for all logged-in users
}

function _startSbPolling(){
  if(_sbPollTimer) clearInterval(_sbPollTimer)
  _sbPollTimer=setInterval(()=>{
    if(S.user) sbPollActivities()
  },30000)
}

async function sbPollActivities(){
  const u=S.user; if(!u) return
  try{
    const rows=await _sbReq('activities?select=data&order=updated_at.desc')
    if(!rows||!rows.length) return
    const remoteActs=rows.map(r=>r.data).filter(Boolean)
    const remoteIds=new Set(remoteActs.map(a=>a.id))
    const localOnly=S.activities.filter(a=>!remoteIds.has(a.id))
    const merged=[...remoteActs,...localOnly]
    merged.sort((a,b)=>(b.added_at||b.date||'').localeCompare(a.added_at||a.date||''))
    const prevIds=new Set(S.activities.map(a=>a.id))
    const newActs=remoteActs.filter(a=>!prevIds.has(a.id))
    S.activities=merged
    try{localStorage.setItem('dt_activities',JSON.stringify(S.activities))}catch(e){}
    if(newActs.length>0){
      // Filter to acts relevant to this user's role/dealer
      const relevant=newActs.filter(a=>{
        if(u.role==='dealer_pic') return a.did===u.dealer_id
        if(u.role==='fsm'){
          const myDealers=window.AUTH_USERS.filter(x=>x.login_id===u.login_id&&x.role==='fsm').map(x=>x.dealer_id)
          if(!myDealers.includes(u.dealer_id)) myDealers.push(u.dealer_id)
          return myDealers.includes(a.did)
        }
        return true // admin/manager sees all
      })
      if(relevant.length>0){
        _refreshCurrentView()
        const dlrs=[...new Set(relevant.map(a=>a.dealer||''))].filter(Boolean).slice(0,2).join(', ')
        toast(`🔄 ${relevant.length} new activit${relevant.length===1?'y':'ies'}${dlrs?' — '+dlrs:''}`,'#2563eb')
      }
    } else {
      // Check for edits/deletes (count changed)
      if(remoteActs.length!==S.activities.length-newActs.length) _refreshCurrentView()
    }
  }catch(e){}
}

function _refreshCurrentView(){
  if(S.page==='dashboard') { try{refreshDashboard()}catch(e){} }
  else if(S.page==='activities'&&S.sub==='list') { try{filterActList()}catch(e){} }
  else if(S.page==='reports') { try{refreshReports()}catch(e){} }
  else if(S.page==='analytics') { try{initAnalyticsSub()}catch(e){} }
}

    info.style.background='#fff1f2'; info.style.color='#e11d48'
    txt.innerHTML='⚠️ End date cannot be before start date'

  info.style.background='#EFF6FF'; info.style.color='#2563eb'
  txt.innerHTML=days===1
    ? `1 day activity — counts as <strong>1 activity</strong>`
    : `${days} day${days>1?'s':''} activity (${new Date(s).toLocaleDateString('en-IN',{day:'2-digit',month:'short'})} – ${new Date(e).toLocaleDateString('en-IN',{day:'2-digit',month:'short'})}) — counts as <strong>1 activity</strong>`

  const tkmPct=parseFloat(document.getElementById('f-tkm-pct')?.value)||0
  const dlrPct=parseFloat(document.getElementById('f-dlr-pct')?.value)||0
  const err=document.getElementById('add-err')
  if(!catId){err.textContent='Please select Activity Type.';err.style.display='block';return}
  if(!dealerId){err.textContent='Please select Dealer.';err.style.display='block';return}
  if(!startDate||!endDate){err.textContent='Please set Start Date and End Date.';err.style.display='block';return}
  if(new Date(endDate)<new Date(startDate)){err.textContent='End Date cannot be before Start Date.';err.style.display='block';return}
  err.style.display='none'
  const c=CATS.find(x=>x.id===catId)||CATS[0]
  const d=DEALERS.find(x=>x.id===dealerId)||DEALERS[0]
  const days=Math.round((new Date(endDate)-new Date(startDate))/(86400000))+1
  const selModels=[...document.querySelectorAll('#model-tags .tag.sel')].map(t=>t.textContent)
  const etbr = getETBRData()
  const act={
    id:'s-'+Date.now(), title:`${c.name} – ${d.short}`,
    cat:c.name, color:c.color, dealer:d.name, did:d.id,
    spend, date:startDate, start_date:startDate, end_date:endDate, days,
    mkt_type:mktType, plan_id:planId,
    tkm_pct:tkmPct, dlr_pct:dlrPct,
    tkm_share:Math.round(spend*tkmPct/100), dlr_share:Math.round(spend*dlrPct/100),
    models:selModels, status:'submitted',
    isNew:true,
    added_by: S.user?.name||'Unknown',
    added_by_role: S.user?.role||'',
    added_at: new Date().toISOString(),
    etbr,
  }
  S.activities.unshift(act)
  try{ localStorage.setItem('dt_activities', JSON.stringify(S.activities)) }catch(e){}
  sbSaveActivity(act) // sync to Supabase if connected
  document.getElementById('add-success').style.display='block'
  toast(`✅ Activity submitted by ${S.user.name}!`,'#22c55e')
  setTimeout(()=>nav('activities','list'),1800)
}

function refreshReports(){
  const acts=getGFActs(); const sub=S.sub||'activity'
  const total=acts.length, spend=acts.reduce((s,a)=>s+(a.spend||0),0)
  const dealers=[...new Set(acts.map(a=>a.did))].length
  ;[['rpt-total',total],['rpt-spend',fmtINR(spend)],['rpt-dealers',dealers]].forEach(([id,v])=>{
    const el=document.getElementById(id); if(el){el.textContent=v;el.classList.add('count-up');setTimeout(()=>el.classList.remove('count-up'),400)}
  })

  if(acts.length===0&&sub!=='download'){
    const tbody=document.getElementById('rpt-tbody')
    if(tbody) tbody.innerHTML=`<tr><td colspan="20" style="text-align:center;padding:48px 24px">
      <div style="font-size:28px;margin-bottom:10px">📋</div>
      <p style="font-size:14px;font-weight:700;color:#111;margin-bottom:6px">No activities to report</p>
      <p style="font-size:12px;color:#9ca3af;margin-bottom:16px">Add activities first to generate reports</p>
      <button onclick="nav('activities','add')" style="padding:10px 22px;background:#EB0A1E;color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer">+ Add Activity</button>
    </td></tr>`
    return
  }

  if(sub==='activity') buildActivityReport(acts)
  if(sub==='expense')  buildExpenseReport(acts)
  if(sub==='dealer')   buildDealerReport(acts)
  updateGFInfo('reports')
}

function buildExpenseReport(acts){

      return {count:da.length,spend:sp,sppa:da.length>0?Math.round(sp/da.length):0}

    const totalSpend=dlrData.reduce((s,d)=>s+d.spend,0)

        ${(()=>{const E=da.reduce((s,a)=>s+(a.etbr?.enquiry||0),0),R=da.reduce((s,a)=>s+(a.etbr?.retailed||0),0),pct=E>0?Math.round(R/E*100):0;
        return E>0?`<span style="background:${pct>=50?'#f0fdf4':pct>=25?'#fffbeb':'#f9fafb'};color:${pct>=50?'#16a34a':pct>=25?'#d97706':'#9ca3af'};font-size:12px;font-weight:700;padding:3px 8px;border-radius:7px">${pct}%</span>`:'—'})()}
      </td>
      <td style="padding:10px 12px"><span style="background:#FFF1F2;color:#EB0A1E;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:7px">${btl}</span></td>
      <td style="padding:10px 12px"><span style="background:#EFF6FF;color:#2563eb;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:7px">${atl}</span></td>
      <td style="padding:10px 12px">
        <div style="display:flex;align-items:center;gap:5px">
          <div style="width:40px;background:#f3f4f6;border-radius:4px;height:5px;overflow:hidden">
            <div style="height:5px;background:#EB0A1E;border-radius:4px;width:${grandActs>0?(da.length/grandActs*100).toFixed(0):0}%"></div>
          </div>
          <span style="font-size:11px;color:#6b7280">${grandActs>0?(da.length/grandActs*100).toFixed(1):0}%</span>
        </div>
      </td>
    </tr>`).join('')

  // Footer totals
  tbody.innerHTML+=`<tr style="background:#f9fafb;border-top:2px solid #f0f0f0">
    <td colspan="3" style="padding:10px 12px;font-size:12.5px;font-weight:800;color:#111">Total</td>
    <td style="padding:10px 12px;font-size:16px;font-weight:800;color:#EB0A1E">${grandActs}</td>
    <td style="padding:10px 12px;font-size:14px;font-weight:800;color:#EB0A1E">${grandSpend>0?fmtINR(grandSpend):'—'}</td>
    <td style="padding:10px 12px;font-size:13px;font-weight:700;color:#374151">${grandActs>0?fmtINR(Math.round(grandSpend/grandActs))+'/ act':'—'}</td>
    <td style="padding:10px 12px;font-size:13px;font-weight:700;color:#EB0A1E">${acts.filter(a=>a.mkt_type==='BTL').length}</td>
    <td style="padding:10px 12px;font-size:13px;font-weight:700;color:#2563eb">${acts.filter(a=>a.mkt_type==='ATL').length}</td>
    <td style="padding:10px 12px;font-size:12px;font-weight:700;color:#111">100%</td>
  </tr>`
}

/* ════ DOWNLOAD HELPERS ════ */
function triggerDownload(url,filename){
  const a=document.createElement('a'); a.href=url; a.download=filename
  document.body.appendChild(a); a.click(); document.body.removeChild(a)
  setTimeout(()=>URL.revokeObjectURL(url),2000)
}

function dlPdfHeader(doc,title,sub){
  const pw=doc.internal.pageSize.getWidth()
  doc.setFillColor(235,10,30); doc.rect(0,0,pw,22,'F')
  doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(14)
  doc.text('TOYOTA DealerTrack',12,9)
  doc.setFontSize(9); doc.setFont('helvetica','normal')
  doc.text(title,12,15)
  doc.text(new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}),pw-14,15,{align:'right'})
  doc.setTextColor(80,80,80); doc.setFontSize(9)
  doc.text('Period: '+GF.from+' — '+GF.to,12,30)
  doc.text('Filter: '+(GF.dealer?(DEALERS.find(d=>d.id===GF.dealer)?.name||'All'):'All Dealers'),pw/2,30,{align:'center'})
  doc.text('Report: '+sub,pw-12,30,{align:'right'})
  return pw
}

function dlPdfFooter(doc){
  const n=doc.internal.getNumberOfPages(), ph=doc.internal.pageSize.getHeight(), pw=doc.internal.pageSize.getWidth()
  for(let i=1;i<=n;i++){
    doc.setPage(i)
    doc.setFontSize(7); doc.setTextColor(150,150,150)
    doc.text('DealerTrack • Toyota Dealer Marketing',12,ph-6)
    doc.text('Page '+i+' of '+n,pw-12,ph-6,{align:'right'})
  }
}

function dlKpiBoxes(doc,boxes,y){
  const pw=doc.internal.pageSize.getWidth()
  const bw=(pw-24)/boxes.length; let bx=12
  boxes.forEach(([l,v,c])=>{
    const rgb=c?[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]:[249,250,251]
    doc.setFillColor(249,250,251); doc.roundedRect(bx,y,bw-3,15,2,2,'F')
    doc.setTextColor(150,150,150); doc.setFontSize(7); doc.setFont('helvetica','normal')
    doc.text(String(l),bx+3,y+5)
    doc.setTextColor(17,17,17); doc.setFontSize(10); doc.setFont('helvetica','bold')
    doc.text(String(v).substring(0,14),bx+3,y+12)
    bx+=bw
  })
  return y+18
}

/* ────────────────────────────────────────────────
   CONTEXT-AWARE DOWNLOAD
   page=dashboard → full dashboard summary
   page=reports, sub=activity → activity matrix
   page=reports, sub=expense → expense matrix
   page=reports, sub=dealer → dealer scorecard
   page=analytics → analytics summary
──────────────────────────────────────────────── */
function dlReport(type){
  if(passkeyGuard()) return
  const acts=getGFActs()
  const page=S.page||'dashboard'
  const sub=S.sub||'activity'
  const ctx=page==='reports'?sub:(page==='analytics'?'analytics':'dashboard')
  const label={dashboard:'Dashboard',activity:'Activity Report',expense:'Expense Report',dealer:'Dealer Report',analytics:'Analytics'}[ctx]||ctx
  const fname=`DealerTrack_${label.replace(/ /g,'_')}_${GF.from}_to_${GF.to}`

  /* ── helpers for each report type ── */
  function actMatrixRows(){
    return CATS.map((cat,i)=>{
      const dlrCounts=DEALERS.map(d=>acts.filter(a=>a.cat===cat.name&&a.did===d.id).length)
      const total=dlrCounts.reduce((s,v)=>s+v,0)
      const sp=acts.filter(a=>a.cat===cat.name).reduce((s,a)=>s+(a.spend||0),0)
      const E=acts.filter(a=>a.cat===cat.name).reduce((s,a)=>s+(a.etbr?.enquiry||0),0)
      const T=acts.filter(a=>a.cat===cat.name).reduce((s,a)=>s+(a.etbr?.td||0),0)
      const B=acts.filter(a=>a.cat===cat.name).reduce((s,a)=>s+(a.etbr?.booking||0),0)
      const R=acts.filter(a=>a.cat===cat.name).reduce((s,a)=>s+(a.etbr?.retailed||0),0)
      const pct=acts.length>0?((total/acts.length)*100).toFixed(1)+'%':'0%'
      return [i+1,cat.name,cat.mkt||'—',total,...dlrCounts,E,T,B,R,pct,sp>0?'₹'+sp.toLocaleString('en-IN'):'—']
    }).sort((a,b)=>b[3]-a[3])
  }
  function actMatrixHeader(){return['#','Activity','Mkt',...DEALERS.map(d=>d.short||d.name.split(' ')[0]),'E','T','B','R','Share','Spend']}

  function expMatrixRows(){
    const grandSp=acts.reduce((s,a)=>s+(a.spend||0),0)||1
    return CATS.map(cat=>{
      const dlrData=DEALERS.map(d=>{
        const da=acts.filter(a=>a.cat===cat.name&&a.did===d.id)
        const sp=da.reduce((s,a)=>s+(a.spend||0),0)
        const sppa=da.length>0?Math.round(sp/da.length):0
        return {count:da.length,spend:sp,sppa}
      })
      const total=dlrData.reduce((s,d)=>s+d.spend,0)
      const totalCount=dlrData.reduce((s,d)=>s+d.count,0)
      const sppa=totalCount>0?Math.round(total/totalCount):0
      const pct=((total/grandSp)*100).toFixed(1)+'%'
      return [
        cat.name,
        cat.mkt||'—',
        total>0?'₹'+total.toLocaleString('en-IN'):'—',
        totalCount||0,
        sppa>0?'₹'+sppa.toLocaleString('en-IN'):'—',
        ...dlrData.map(({count,spend,sppa:ds})=>
          spend>0 ? '₹'+spend.toLocaleString('en-IN')+' ('+count+' acts) ₹'+ds.toLocaleString('en-IN')+'/act' : '—'
        ),
        pct
      ]
    }).sort((a,b)=>(parseInt(String(b[2]).replace(/[₹,]/g,''))||0)-(parseInt(String(a[2]).replace(/[₹,]/g,''))||0))
  }
  function expMatrixHeader(){
    return ['Activity','Mkt','Total Spend','Total Acts','Spend/Act',...DEALERS.map(d=>(d.short||d.name.split(' ')[0])+' Spend(Acts)Sppa'),'Share']
  }

  function dealerRows(){
    return DEALERS.map(d=>{
      const da=acts.filter(a=>a.did===d.id)
      const sp=da.reduce((s,a)=>s+(a.spend||0),0)
      const sppa=da.length>0?Math.round(sp/da.length):0
      const E=da.reduce((s,a)=>s+(a.etbr?.enquiry||0),0)
      const T=da.reduce((s,a)=>s+(a.etbr?.td||0),0)
      const B=da.reduce((s,a)=>s+(a.etbr?.booking||0),0)
      const R=da.reduce((s,a)=>s+(a.etbr?.retailed||0),0)
      const conv=E>0?Math.round(R/E*100)+'%':'—'
      const btl=da.filter(a=>a.mkt_type==='BTL').length
      const atl=da.filter(a=>a.mkt_type==='ATL').length
      const share=acts.length>0?((da.length/acts.length)*100).toFixed(1)+'%':'0%'
      return [d.name,d.region,da.length,sp>0?'₹'+sp.toLocaleString('en-IN'):'—',sppa>0?'₹'+sppa.toLocaleString('en-IN'):'—',E||'—',T||'—',B||'—',R||'—',conv,btl,atl,share]
    }).sort((a,b)=>b[2]-a[2])
  }
  const dealerHeader=['Dealer','Region','Acts','Total Spend','Spend/Act','E','T','B','R','Conv%','BTL','ATL','Share']

  /* ════ CSV ════ */
  if(type==='csv'){
    try{
      let header,rows
      if(ctx==='activity'){header=actMatrixHeader();rows=actMatrixRows()}
      else if(ctx==='expense'){header=expMatrixHeader();rows=expMatrixRows()}
      else if(ctx==='dealer'){header=dealerHeader;rows=dealerRows()}
      else{
        // dashboard / analytics — all activities with full detail
        header=['#','Activity','Dealer','Category','Mkt Type','Start','End','Spend','TKM','Dealer Share','E','T','B','R','Status','Added By']
        rows=acts.map((a,i)=>[i+1,a.title||a.cat,a.dealer,a.cat,a.mkt_type||'—',a.start_date||a.date,a.end_date||a.date,
          '₹'+(a.spend||0).toLocaleString('en-IN'),'₹'+(a.tkm_share||0).toLocaleString('en-IN'),'₹'+(a.dlr_share||0).toLocaleString('en-IN'),
          a.etbr?.enquiry||0,a.etbr?.td||0,a.etbr?.booking||0,a.etbr?.retailed||0,
          a.status,a.added_by||'—'])
      }
      const csv=[header,...rows].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n')
      triggerDownload(URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'})),fname+'.csv')
      toast('✅ CSV — '+fname,'#22c55e')
    }catch(e){toast('⚠️ CSV: '+e.message,'#f59e0b')}
    return
  }

  /* ════ EXCEL ════ */
  if(type==='excel'){
    try{
      if(typeof XLSX==='undefined') throw new Error('SheetJS not loaded — check internet connection')
      const wb=XLSX.utils.book_new()
      const meta=[['DealerTrack — '+label],['Period:',GF.from+' to '+GF.to],['Filter:',GF.dealer?(DEALERS.find(d=>d.id===GF.dealer)?.name):'All Dealers'],['Generated:',new Date().toLocaleString('en-IN')],['']]

      if(ctx==='activity'){
        const ws=XLSX.utils.aoa_to_sheet([...meta,actMatrixHeader(),...actMatrixRows()])
        ws['!cols']=[{wch:4},{wch:28},{wch:6},...DEALERS.map(()=>({wch:10})),{wch:6},{wch:6},{wch:6},{wch:6},{wch:8},{wch:14}]
        XLSX.utils.book_append_sheet(wb,ws,'Activity Report')
      } else if(ctx==='expense'){
        const ws=XLSX.utils.aoa_to_sheet([...meta,expMatrixHeader(),...expMatrixRows()])
        ws['!cols']=[{wch:30},{wch:8},{wch:14},{wch:10},{wch:14},...DEALERS.map(()=>({wch:28})),{wch:8}]
        XLSX.utils.book_append_sheet(wb,ws,'Expense Report')
      } else if(ctx==='dealer'){
        const ws=XLSX.utils.aoa_to_sheet([...meta,dealerHeader,...dealerRows()])
        ws['!cols']=[{wch:22},{wch:10},{wch:8},{wch:14},{wch:14},{wch:6},{wch:6},{wch:6},{wch:6},{wch:8},{wch:6},{wch:6},{wch:8}]
        XLSX.utils.book_append_sheet(wb,ws,'Dealer Report')
      } else {
        // Dashboard / Analytics — 4 sheets
        const actHdr=['#','Activity','Dealer','Category','Mkt Type','Start','End','Spend','TKM','Dealer Share','E','T','B','R','Status','Added By']
        const actRows=acts.map((a,i)=>[i+1,a.title||a.cat,a.dealer,a.cat,a.mkt_type||'—',a.start_date||a.date,a.end_date||a.date,'₹'+(a.spend||0).toLocaleString('en-IN'),'₹'+(a.tkm_share||0).toLocaleString('en-IN'),'₹'+(a.dlr_share||0).toLocaleString('en-IN'),a.etbr?.enquiry||0,a.etbr?.td||0,a.etbr?.booking||0,a.etbr?.retailed||0,a.status,a.added_by||'—'])
        const ws1=XLSX.utils.aoa_to_sheet([...meta,actHdr,...actRows])
        ws1['!cols']=[{wch:4},{wch:28},{wch:20},{wch:18},{wch:8},{wch:12},{wch:12},{wch:14},{wch:14},{wch:14},{wch:6},{wch:6},{wch:6},{wch:6},{wch:12},{wch:18}]
        XLSX.utils.book_append_sheet(wb,ws1,'All Activities')
        const ws2=XLSX.utils.aoa_to_sheet([[...meta,['']][0],dealerHeader,...dealerRows()])
        XLSX.utils.book_append_sheet(wb,ws2,'Dealer Summary')
        const ws3=XLSX.utils.aoa_to_sheet([...meta,actMatrixHeader(),...actMatrixRows()])
        XLSX.utils.book_append_sheet(wb,ws3,'Activity Matrix')
        const eb=etbrOf(acts)
        const ws4=XLSX.utils.aoa_to_sheet([['ETBR Intelligence'],[''],['Metric','Value'],['Total Enquiries',eb.E],['Test Drives',eb.T],['Bookings',eb.B],['Retailed',eb.R],['E→T Conv',eb.etConv],['T→B Conv',eb.tbConv],['B→R Conv',eb.brConv],['E→R Conv',eb.erConv],['Cost/Enquiry',eb.cpe],['Cost/Test Drive',eb.cpt],['Cost/Booking',eb.cpb],['Cost/Retail',eb.cpr]])
        ws4['!cols']=[{wch:22},{wch:18}]
        XLSX.utils.book_append_sheet(wb,ws4,'ETBR Intelligence')
      }
      XLSX.writeFile(wb,fname+'.xlsx')
      toast('✅ Excel — '+fname,'#22c55e')
    }catch(e){toast('⚠️ Excel: '+e.message,'#f59e0b')}
    return
  }

  /* ════ PDF ════ */
  if(type==='pdf'){
    try{
      if(typeof window.jspdf==='undefined'&&typeof jsPDF==='undefined') throw new Error('jsPDF not loaded')
      const {jsPDF}=window.jspdf||window
      const doc=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'})
      const pw=dlPdfHeader(doc,label,'Period: '+GF.from+' to '+GF.to)
      const totalSpend=acts.reduce((s,a)=>s+(a.spend||0),0)
      const eb=etbrOf(acts)

      // KPI boxes
      let y=dlKpiBoxes(doc,[
        ['Total Activities',acts.length],
        ['Total Spend',fmtINR(totalSpend)],
        ['TKM Share',fmtINR(acts.reduce((s,a)=>s+(a.tkm_share||0),0))],
        ['Dealer Share',fmtINR(acts.reduce((s,a)=>s+(a.dlr_share||0),0))],
        ['Enquiries',eb.E],['Test Drives',eb.T],['Bookings',eb.B],['Retailed',eb.R],
        ['E→R Conv',eb.erConv]
      ],34)

      // Main table based on context
      let head,body,colStyles={}
      if(ctx==='activity'){
        head=[actMatrixHeader()]; body=actMatrixRows()
        colStyles={1:{cellWidth:40},2:{cellWidth:10}}
      } else if(ctx==='expense'){
        head=[expMatrixHeader()]; body=expMatrixRows()
        colStyles={0:{cellWidth:40},1:{cellWidth:10}}
      } else if(ctx==='dealer'){
        head=[dealerHeader]; body=dealerRows()
        colStyles={0:{cellWidth:35},1:{cellWidth:16}}
      } else {
        head=[['#','Activity','Dealer','Category','Mkt','Dates','Spend','TKM','E','T','B','R','Status']]
        body=acts.map((a,i)=>[i+1,a.title||a.cat,a.dealer,a.cat,a.mkt_type||'—',(a.start_date||a.date)+(a.end_date&&a.end_date!==a.start_date?' — '+a.end_date:''),'₹'+(a.spend||0).toLocaleString('en-IN'),'₹'+(a.tkm_share||0).toLocaleString('en-IN'),a.etbr?.enquiry||0,a.etbr?.td||0,a.etbr?.booking||0,a.etbr?.retailed||0,a.status])
        colStyles={1:{cellWidth:35},2:{cellWidth:28},3:{cellWidth:30}}
      }

      doc.autoTable({
        startY:y+2, head, body,
        styles:{fontSize:7,cellPadding:2,overflow:'linebreak'},
        headStyles:{fillColor:[235,10,30],textColor:255,fontStyle:'bold',fontSize:7.5},
        alternateRowStyles:{fillColor:[250,250,250]},
        columnStyles:colStyles,
        margin:{left:10,right:10},
      })

      // ETBR funnel on last page if space
      const fy=doc.lastAutoTable.finalY+8
      if(fy<doc.internal.pageSize.getHeight()-50){
        doc.setFontSize(9); doc.setFont('helvetica','bold'); doc.setTextColor(17,17,17)
        doc.text('ETBR Conversion',10,fy)
        doc.autoTable({
          startY:fy+4,
          head:[['Stage','Count','Conversion']],
          body:[['Enquiry',eb.E,'—'],['Test Drive',eb.T,'E→T: '+eb.etConv],['Booking',eb.B,'T→B: '+eb.tbConv],['Retail',eb.R,'B→R: '+eb.brConv],['End-to-End','—',eb.erConv]],
          styles:{fontSize:8,cellPadding:2.5},
          headStyles:{fillColor:[124,58,237],textColor:255,fontStyle:'bold'},
          margin:{left:10,right:10},tableWidth:100,
        })
      }

      dlPdfFooter(doc)
      doc.save(fname+'.pdf')
      toast('✅ PDF — '+fname,'#22c55e')
    }catch(e){toast('⚠️ PDF: '+e.message,'#f59e0b')}
    return
  }

  toast('⚠️ Unknown format: '+type,'#f59e0b')
}

function initAnalytics(){ setTimeout(initAnalyticsSub,80) }

function initAnalyticsSub(){
  const sub=S.sub||'overview'
  const acts=getGFActs()
  Object.values(S.charts).forEach(c=>c&&c.destroy&&c.destroy()); S.charts={}

  // Empty state when no activities
  const body=document.getElementById('analytics-body')
  if(acts.length===0){
    if(body) body.innerHTML=`<div style="text-align:center;padding:56px 24px">
      <div style="font-size:32px;margin-bottom:12px">📈</div>

  if(sub==='overview') renderAnalyticsOverview()
  if(sub==='trend')    renderAnalyticsTrend()

  if(sub==='geo')      renderAnalyticsGeo()
}

// Shared chart helpers
function mkDonut(id,labels,data,colors,legId){
  const el=document.getElementById(id); if(!el) return null
  const total=data.reduce((a,b)=>a+b,0)||1
  const ch=new Chart(el,{type:'doughnut',data:{labels,datasets:[{data,backgroundColor:colors,borderWidth:2,borderColor:'#fff'}]},
    options:{cutout:'66%',plugins:{legend:{display:false},tooltip:{callbacks:{
          title:items=>`${items[0].label}`,
          label:item=>`  ${item.parsed} (${(item.parsed/total*100).toFixed(1)}%)`,
          labelColor:item=>({backgroundColor:item.dataset.backgroundColor[item.dataIndex]||'#EB0A1E',borderColor:'transparent'})
        },backgroundColor:'#111',titleColor:'#9ca3af',bodyColor:'#fff',padding:10,cornerRadius:8,borderColor:'#333',borderWidth:1}}}})
  renderLegendTop5(legId,labels,data,colors,total)
  return ch
}

function renderLegendTop5(legId,labels,data,colors,total,expanded){
  const leg=document.getElementById(legId); if(!leg) return
  const t=total||data.reduce((a,b)=>a+b,0)||1
  const LIMIT=5
  const all=labels.map((l,i)=>({l,v:data[i],c:colors[i]})).sort((a,b)=>b.v-a.v)
  const visible=expanded?all:all.slice(0,LIMIT)
  const hasMore=all.length>LIMIT

  leg.innerHTML=visible.map(({l,v,c})=>`
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:3px">
      <div style="display:flex;align-items:center;gap:5px;min-width:0">
        <span style="width:8px;height:8px;border-radius:50%;background:${c};flex-shrink:0"></span>
        <span style="color:#374151;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px">${l}</span>
      </div>
      <span style="color:#6b7280;font-weight:600;font-size:10.5px;margin-left:4px;flex-shrink:0">${v}</span>
    </div>`).join('')

  if(hasMore){
    const remaining=all.length-LIMIT
    leg.innerHTML+=`<button onclick="renderLegendTop5('${legId}',${JSON.stringify(labels)},${JSON.stringify(data)},${JSON.stringify(colors)},${t},${!expanded})"
      style="margin-top:5px;width:100%;padding:4px 8px;background:none;border:1.5px solid #e5e7eb;border-radius:7px;font-size:11px;font-weight:600;color:#6b7280;cursor:pointer;text-align:center;transition:all .15s"
      onmouseover="this.style.borderColor='#EB0A1E';this.style.color='#EB0A1E'"
      onmouseout="this.style.borderColor='#e5e7eb';this.style.color='#6b7280'">
      ${expanded?'▲ Show Less':'▼ Show '+(remaining)+' More'}
    </button>`
  }
}
function mkBarH(id,labels,data,color,h){
  const el=document.getElementById(id); if(!el) return null
  const maxLen=Math.max(...labels.map(l=>String(l).length))
  const labelW=Math.min(100,Math.max(60,maxLen*7))
  return new Chart(el,{type:'bar',data:{labels,datasets:[{data,backgroundColor:color,borderRadius:5,label:''}]},
    options:{maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{display:false}},
      scales:{
        x:{grid:{display:false},ticks:{font:{size:10}},beginAtZero:true,precision:0},
        y:{grid:{display:false},ticks:{font:{size:10.5},color:'#374151'},afterFit(s){s.width=labelW}}
      }}})}
function mkLine(id,labels,datasets){
  const el=document.getElementById(id); if(!el) return null
  return new Chart(el,{type:'line',data:{labels,datasets},
    options:{maintainAspectRatio:false,responsive:true,interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:false}},
      scales:{x:{grid:{display:false},ticks:{font:{size:10},color:'#9ca3af',maxRotation:0}},
              y:{grid:{color:'#f8f8f8'},ticks:{font:{size:10},color:'#9ca3af'},beginAtZero:true}}}})
}

function _buildTrendChart(acts, days, dayLabels){
  const el=document.getElementById('tr-total'); if(!el) return
  if(window._trendChart){window._trendChart.destroy();window._trendChart=null}
  window._trendChart=new Chart(el,{type:'line',
    data:{labels:dayLabels,datasets:[{
      label:'Total Activities',
      borderColor:'#EB0A1E',
      backgroundColor:'rgba(235,10,30,.08)',
      data:days.map(d=>acts.filter(a=>a.date===d).length),
      tension:.4,fill:true,borderWidth:2.5,
      pointRadius:4,pointBackgroundColor:'#EB0A1E',pointBorderColor:'#fff',pointBorderWidth:2,
    }]},
    options:{maintainAspectRatio:false,responsive:true,
      interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:false},tooltip:{
        callbacks:{
          title:items=>`${items[0].label}`,
          label:item=>`  Activities: ${item.parsed.y}`,
        },
        backgroundColor:'#111',titleColor:'#9ca3af',bodyColor:'#fff',padding:10,cornerRadius:8,borderColor:'#333',borderWidth:1,
      }},
      scales:{
        x:{grid:{display:false},ticks:{font:{size:10},color:'#9ca3af',maxRotation:0}},
        y:{grid:{color:'#f8f8f8'},ticks:{font:{size:10},color:'#9ca3af'},beginAtZero:true,precision:0}
      }
    }})
}

function refreshTrendChart(){
  const selDlr=document.getElementById('tr-dlr-filter')?.value||''
  const btn=document.querySelector('[onclick="refreshTrendChart()"]')
  const acts=getGFActs().filter(a=>!selDlr||a.did===selDlr)
  const days=dateDaysArray(GF.from,GF.to)
  const dayLabels=days.map(d=>new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short'}))

  // Show/hide filter info
  const info=document.getElementById('tr-filter-info')
  if(info){
    if(selDlr){
      const dlr=DEALERS.find(d=>d.id===selDlr)
      info.innerHTML=`🔍 Filtered to <b>${dlr?.name||selDlr}</b> — ${acts.length} activit${acts.length!==1?'ies':'y'}`
      info.style.display='block'
    } else {
      info.style.display='none'
    }
  }
  // Reset dealer filter if ✕ clicked
  if(selDlr===undefined||!selDlr){
    const sel=document.getElementById('tr-dlr-filter'); if(sel) sel.value=''
  }
  _buildTrendChart(acts,days,dayLabels)
}

function openEditDealer(id){
  const d=window.ST_DEALERS.find(x=>x.id===id); if(!d) return
  openStModal(dealerFormHTML(d,false))
}
function openAddDealer(){ openStModal(dealerFormHTML(null,true)) }

function saveEditDealer(id){
  if(passkeyGuard()) return
  const name=document.getElementById('df-name').value.trim().toUpperCase()
  const code=document.getElementById('df-code').value.trim().toUpperCase()
  const region=document.getElementById('df-region').value
  const active=document.getElementById('df-toggle').dataset.on==='1'
  const err=document.getElementById('df-err')
  if(!name||!code||!region){err.textContent='Dealer Name, Code and Region are required';err.style.display='block';return}
  if(window.ST_DEALERS.find(d=>d.code===code&&d.id!==id)){err.textContent='Dealer Code already in use';err.style.display='block';return}
  const idx=window.ST_DEALERS.findIndex(x=>x.id===id); if(idx<0) return
  window.ST_DEALERS[idx]={...window.ST_DEALERS[idx],name,code,region,active}
  closeStModal(); refreshDealersTable(); ST_DIRTY.mark('dealers')
  toast(`✅ "${name}" updated`,'#22c55e')
}

function saveNewDealer(){
  if(passkeyGuard()) return
  const name=document.getElementById('df-name').value.trim().toUpperCase()
  const code=document.getElementById('df-code').value.trim().toUpperCase()
  const region=document.getElementById('df-region').value
  const active=document.getElementById('df-toggle').dataset.on==='1'
  const err=document.getElementById('df-err')
  if(!name||!code||!region){err.textContent='Dealer Name, Code and Region are required';err.style.display='block';return}
  if(window.ST_DEALERS.find(d=>d.code===code)){err.textContent='Dealer Code already exists';err.style.display='block';return}
  const id='d'+Date.now()
  window.ST_DEALERS.push({id,name,code,region,active,created_at:new Date().toISOString()})
  ST_DIRTY.mark('dealers'); closeStModal(); stReload()
  toast(`✅ "${name}" added`,'#22c55e')
}

function deleteDealer(id){
  if(passkeyGuard()) return
  const d=window.ST_DEALERS.find(x=>x.id===id); if(!d) return
  if(!confirm(`Delete dealer "${d.name}"?\n\nAll associated activities will lose this dealer reference.`)) return
  window.ST_DEALERS=window.ST_DEALERS.filter(x=>x.id!==id)
  refreshDealersTable(); ST_DIRTY.mark('dealers')
  toast(`🗑️ "${d.name}" deleted`,'#e11d48')
}

function refreshDealersTable(){
  const tbody=document.getElementById('dealers-tbody'); if(!tbody) return
  tbody.innerHTML=window.ST_DEALERS.map((d,i)=>dealerRow(d,i)).join('')
  const h2=tbody.closest('.card')?.querySelector('h2')
  if(h2) h2.innerHTML=`Dealer Master <span style="font-size:12px;color:#9ca3af;font-weight:400">(${window.ST_DEALERS.length} dealers)</span>`
  const sbCount=document.getElementById('sb-dealer-count'); if(sbCount) sbCount.textContent=window.ST_DEALERS.length
}

/* Download ALL reports in one Excel workbook — 4 sheets */
function dlAllReports(){
  if(passkeyGuard()) return
  try{
    if(typeof XLSX==='undefined') throw new Error('SheetJS not loaded — check internet connection')
    const acts=getGFActs()
    const wb=XLSX.utils.book_new()
    const fname=`DealerTrack_All_Reports_${GF.from}_to_${GF.to}`
    const meta=[
      ['DealerTrack — All Reports'],
      ['Period:', GF.from+' to '+GF.to],
      ['Dealer Filter:', GF.dealer?(DEALERS.find(d=>d.id===GF.dealer)?.name||'All'):'All Dealers'],
      ['Generated:', new Date().toLocaleString('en-IN')],
      ['Total Activities:', acts.length],
      ['Total Spend:', '₹'+acts.reduce((s,a)=>s+(a.spend||0),0).toLocaleString('en-IN')],
      ['']
    ]

    // ── Sheet 1: Activity Report ──
    const actHdr=['#','Activity','Mkt Type',...DEALERS.map(d=>d.short||d.name.split(' ')[0]),'E','T','B','R','Share %','Total Spend']
    const actRows=CATS.map((cat,i)=>{
      const dlrCounts=DEALERS.map(d=>acts.filter(a=>a.cat===cat.name&&a.did===d.id).length)
      const total=dlrCounts.reduce((s,v)=>s+v,0)
      const sp=acts.filter(a=>a.cat===cat.name).reduce((s,a)=>s+(a.spend||0),0)
      const E=acts.filter(a=>a.cat===cat.name).reduce((s,a)=>s+(a.etbr?.enquiry||0),0)
      const T=acts.filter(a=>a.cat===cat.name).reduce((s,a)=>s+(a.etbr?.td||0),0)
      const B=acts.filter(a=>a.cat===cat.name).reduce((s,a)=>s+(a.etbr?.booking||0),0)
      const R=acts.filter(a=>a.cat===cat.name).reduce((s,a)=>s+(a.etbr?.retailed||0),0)
      const pct=acts.length>0?((total/acts.length)*100).toFixed(1)+'%':'0%'
      return [i+1,cat.name,cat.mkt||'—',...dlrCounts,E,T,B,R,pct,sp>0?'₹'+sp.toLocaleString('en-IN'):'—']
    }).sort((a,b)=>b[3]-a[3])
    // Totals row
    const actTotals=['TOTAL','','',
      ...DEALERS.map(d=>acts.filter(a=>a.did===d.id).length),
      acts.reduce((s,a)=>s+(a.etbr?.enquiry||0),0),acts.reduce((s,a)=>s+(a.etbr?.td||0),0),
      acts.reduce((s,a)=>s+(a.etbr?.booking||0),0),acts.reduce((s,a)=>s+(a.etbr?.retailed||0),0),
      '100%','₹'+acts.reduce((s,a)=>s+(a.spend||0),0).toLocaleString('en-IN')]
    const ws1=XLSX.utils.aoa_to_sheet([...meta,actHdr,...actRows,[actTotals]])
    ws1['!cols']=[{wch:4},{wch:30},{wch:8},...DEALERS.map(()=>({wch:10})),{wch:6},{wch:6},{wch:6},{wch:6},{wch:8},{wch:14}]
    XLSX.utils.book_append_sheet(wb,ws1,'Activity Report')

    // ── Sheet 2: Expense Report (matches card: Total Spend, Total Acts, Spend/Act, Dealer spend/acts/sppa) ──
    const expHdr2=['Activity','Mkt Type','Total Spend','Total Acts','Spend/Act',...DEALERS.map(d=>d.short||d.name.split(' ')[0]+' (Spend/Acts/SPpA)'),'Share %']
    const grandSp2=acts.reduce((s,a)=>s+(a.spend||0),0)||1
    const expRows2=CATS.map(cat=>{
      const dlrData2=DEALERS.map(d=>{
        const da=acts.filter(a=>a.cat===cat.name&&a.did===d.id)
        const sp=da.reduce((s,a)=>s+(a.spend||0),0)
        const sppa=da.length>0?Math.round(sp/da.length):0
        return {count:da.length,spend:sp,sppa}
      })
      const total=dlrData2.reduce((s,d)=>s+d.spend,0)
      const totalCount=dlrData2.reduce((s,d)=>s+d.count,0)
      const sppa=totalCount>0?Math.round(total/totalCount):0
      const pct=((total/grandSp2)*100).toFixed(1)+'%'
      return [
        cat.name,cat.mkt||'—',
        total>0?'₹'+total.toLocaleString('en-IN'):'—',
        totalCount||0,
        sppa>0?'₹'+sppa.toLocaleString('en-IN'):'—',
        ...dlrData2.map(({count,spend,sppa:ds})=>spend>0?'₹'+spend.toLocaleString('en-IN')+' ('+count+' acts) ₹'+ds.toLocaleString('en-IN')+'/act':'—'),
        pct
      ]
    }).sort((a,b)=>(parseInt(String(b[2]).replace(/[₹,]/g,''))||0)-(parseInt(String(a[2]).replace(/[₹,]/g,''))||0))
    const expTotals2=[
      'TOTAL','',
      '₹'+acts.reduce((s,a)=>s+(a.spend||0),0).toLocaleString('en-IN'),
      acts.length,
      acts.length>0?'₹'+Math.round(acts.reduce((s,a)=>s+(a.spend||0),0)/acts.length).toLocaleString('en-IN'):'—',
      ...DEALERS.map(d=>{
        const da=acts.filter(a=>a.did===d.id)
        const sp=da.reduce((s,a)=>s+(a.spend||0),0)
        const sppa=da.length>0?Math.round(sp/da.length):0
        return sp>0?'₹'+sp.toLocaleString('en-IN')+' ('+da.length+' acts) ₹'+sppa.toLocaleString('en-IN')+'/act':'—'
      }),
      '100%'
    ]
    const ws2=XLSX.utils.aoa_to_sheet([...meta,expHdr2,...expRows2,[expTotals2]])
    ws2['!cols']=[{wch:30},{wch:8},{wch:14},{wch:10},{wch:14},...DEALERS.map(()=>({wch:30})),{wch:8}]
    XLSX.utils.book_append_sheet(wb,ws2,'Expense Report')

    // ── Sheet 3: Dealer Report ──
    const dlrHdr=['Dealer','Region','Activities','Total Spend','Spend/Activity','E','T','B','R','Conv %','BTL','ATL','Share %']
    const dlrRows=DEALERS.map(d=>{
      const da=acts.filter(a=>a.did===d.id)
      const sp=da.reduce((s,a)=>s+(a.spend||0),0)
      const sppa=da.length>0?Math.round(sp/da.length):0
      const E=da.reduce((s,a)=>s+(a.etbr?.enquiry||0),0)
      const T=da.reduce((s,a)=>s+(a.etbr?.td||0),0)
      const B=da.reduce((s,a)=>s+(a.etbr?.booking||0),0)
      const R=da.reduce((s,a)=>s+(a.etbr?.retailed||0),0)
      const conv=E>0?Math.round(R/E*100)+'%':'—'
      const btl=da.filter(a=>a.mkt_type==='BTL').length
      const atl=da.filter(a=>a.mkt_type==='ATL').length
      const share=acts.length>0?((da.length/acts.length)*100).toFixed(1)+'%':'0%'
      return [d.name,d.region,da.length,sp>0?'₹'+sp.toLocaleString('en-IN'):'—',sppa>0?'₹'+sppa.toLocaleString('en-IN'):'—',E||'—',T||'—',B||'—',R||'—',conv,btl,atl,share]
    }).sort((a,b)=>b[2]-a[2])
    const dlrTotals=['TOTAL','ALL',acts.length,
      '₹'+acts.reduce((s,a)=>s+(a.spend||0),0).toLocaleString('en-IN'),
      acts.length>0?'₹'+Math.round(acts.reduce((s,a)=>s+(a.spend||0),0)/acts.length).toLocaleString('en-IN'):'—',
      acts.reduce((s,a)=>s+(a.etbr?.enquiry||0),0)||'—',
      acts.reduce((s,a)=>s+(a.etbr?.td||0),0)||'—',
      acts.reduce((s,a)=>s+(a.etbr?.booking||0),0)||'—',
      acts.reduce((s,a)=>s+(a.etbr?.retailed||0),0)||'—',
      '—',acts.filter(a=>a.mkt_type==='BTL').length,acts.filter(a=>a.mkt_type==='ATL').length,'100%']
    const ws3=XLSX.utils.aoa_to_sheet([...meta,dlrHdr,...dlrRows,[dlrTotals]])
    ws3['!cols']=[{wch:22},{wch:10},{wch:10},{wch:14},{wch:14},{wch:6},{wch:6},{wch:6},{wch:6},{wch:8},{wch:6},{wch:6},{wch:8}]
    XLSX.utils.book_append_sheet(wb,ws3,'Dealer Report')

    // ── Sheet 4: ETBR Intelligence ──
    const eb=etbrOf(acts)
    const etbrMeta=[...meta,['ETBR Intelligence — Conversion Analysis'],['']]
    const etbrHdr=['Metric','Value','Notes']
    const etbrRows=[
      ['Total Enquiries',eb.E,'Walk-ins and leads generated from activities'],
      ['Test Drives Conducted',eb.T,'Test drives taken during activity period'],
      ['Total Bookings',eb.B,'Orders placed / booked'],
      ['Total Retailed',eb.R,'Final retail conversions'],
      [''],
      ['E→T Conversion',eb.etConv,'Enquiry to Test Drive conversion rate'],
      ['T→B Conversion',eb.tbConv,'Test Drive to Booking conversion rate'],
      ['B→R Conversion',eb.brConv,'Booking to Retail conversion rate'],
      ['End-to-End (E→R)',eb.erConv,'Overall Enquiry to Retail conversion'],
      [''],
      ['Cost per Enquiry',eb.cpe,'Total spend divided by total enquiries'],
      ['Cost per Test Drive',eb.cpt,'Total spend divided by test drives'],
      ['Cost per Booking',eb.cpb,'Total spend divided by bookings'],
      ['Cost per Retail',eb.cpr,'Total spend divided by retail conversions'],
      [''],
      ...DEALERS.map(d=>{
        const da=acts.filter(a=>a.did===d.id)
        const E=da.reduce((s,a)=>s+(a.etbr?.enquiry||0),0)
        const R=da.reduce((s,a)=>s+(a.etbr?.retailed||0),0)
        const conv=E>0?Math.round(R/E*100)+'%':'—'
        return [d.name+' — E→R',conv,`E:${E} T:${da.reduce((s,a)=>s+(a.etbr?.td||0),0)} B:${da.reduce((s,a)=>s+(a.etbr?.booking||0),0)} R:${R}`]
      })
    ]
    const ws4=XLSX.utils.aoa_to_sheet([...etbrMeta,etbrHdr,...etbrRows])
    ws4['!cols']=[{wch:30},{wch:16},{wch:45}]
    XLSX.utils.book_append_sheet(wb,ws4,'ETBR Intelligence')

    XLSX.writeFile(wb,fname+'.xlsx')
    toast(`✅ All Reports downloaded — 4 sheets · ${acts.length} activities`,'#22c55e')
  }catch(e){toast('⚠️ Download failed: '+e.message,'#f59e0b')}
}
const ST_DIRTY = {
  dealers:   false,
  users:     false,
  models:    false,
  actmaster: false,
  _snapshots: {},

  mark(sub){
    this[sub]=true
    const bar=document.getElementById('st-save-bar')
    if(bar) bar.style.display='flex'
    // Count badge on tab
    const btn=document.getElementById('st-tab-'+sub)
    if(btn) btn.setAttribute('data-dirty','1')
    this._updateBar()
  },

  clear(sub){
    this[sub]=false
    const bar=document.getElementById('st-save-bar')
    if(bar) bar.style.display='none'
    const btn=document.getElementById('st-tab-'+sub)
    if(btn) btn.removeAttribute('data-dirty')
    this._updateBar()
  },

  snapshot(sub){
    // Take a deep clone of master data for discard
    if(sub==='dealers') this._snapshots.dealers=JSON.parse(JSON.stringify(window.ST_DEALERS||[]))
    if(sub==='users')   this._snapshots.users=JSON.parse(JSON.stringify(window.AUTH_USERS||[]))
    if(sub==='models')  this._snapshots.models=JSON.parse(JSON.stringify(window.ST_MODELS||[]))
  },

  discard(sub){
    if(sub==='dealers'&&this._snapshots.dealers) window.ST_DEALERS=JSON.parse(JSON.stringify(this._snapshots.dealers))
    if(sub==='users'&&this._snapshots.users)     window.AUTH_USERS=JSON.parse(JSON.stringify(this._snapshots.users))
    if(sub==='models'&&this._snapshots.models)   window.ST_MODELS=JSON.parse(JSON.stringify(this._snapshots.models))
    this.clear(sub)
  },

  save(sub){
    // Persist to localStorage for offline persistence
    if(sub==='dealers') dbCommit('dealers')
    if(sub==='users')   dbCommit('users')
    if(sub==='models')  dbCommit('models')
    if(sub==='actmaster') dbCommit('cats')
    // Snapshot current = new saved baseline
    this.snapshot(sub)
    this.clear(sub)
    toast(`✅ ${sub.charAt(0).toUpperCase()+sub.slice(1).replace('actmaster','Activity Master')} saved & synced offline`,'#22c55e')
  },

  _updateBar(){
    const bar=document.getElementById('st-save-bar')
    if(!bar) return
    const any=this.dealers||this.users||this.models||this.actmaster
    bar.style.display=any?'flex':'none'
  }
}

function _getUFValues(){
  return {
    name:   document.getElementById('uf-name')?.value.trim()||'',
    login_id: document.getElementById('uf-login')?.value.trim()||'',
    pwd:    document.getElementById('uf-pwd')?.value||'',
    role:   document.getElementById('uf-role')?.value||'dealer_pic',
    dealer_id: document.getElementById('uf-dealer')?.value||'',
  }
}

function saveEditUser(id){
  if(passkeyGuard()) return
  const {name,login_id,pwd,role,dealer_id}=_getUFValues()
  if(!name||!login_id){showUFErr('Name and Login ID are required');return}
  // Check duplicate login_id (excluding self)
  if(window.AUTH_USERS.find(u=>u.login_id===login_id&&u.id!==id)){showUFErr('Login ID already used by another user');return}
  const idx=window.AUTH_USERS.findIndex(x=>x.id===id); if(idx<0) return
  const dlr=DEALERS.find(d=>d.id===dealer_id)
  window.AUTH_USERS[idx]={
    ...window.AUTH_USERS[idx],
    name,
    login_id,
    password: pwd||window.AUTH_USERS[idx].password, // keep old if blank
    role,
    dealer_id,
    dealer_name: dlr?.name||'',
    rl: role==='dealer_pic'?(dlr?.name||'All Dealers'):stRoleLabel(role),
    roleLabel: stRoleLabel(role),
  }
  // If currently logged-in user edited their own record, update session
  if(S.user?.id===id) S.user={...window.AUTH_USERS[idx]}
  closeStModal(); refreshUsersTable(); ST_DIRTY.mark('users')
  toast(`✅ "${name}" updated — login credentials changed`,'#22c55e')
}

function saveNewUser(){
  if(passkeyGuard()) return
  const {name,login_id,pwd,role,dealer_id}=_getUFValues()
  if(!name){showUFErr('Full Name is required');return}
  if(!login_id){showUFErr('Login ID is required');return}
  if(!pwd){showUFErr('Password is required for new users');return}
  if(window.AUTH_USERS.find(u=>u.login_id===login_id)){showUFErr('Login ID already exists — choose a different one');return}
  const dlr=DEALERS.find(d=>d.id===dealer_id)
  ST_DIRTY.mark('users')
  window.AUTH_USERS.push({
    id:'u'+Date.now(),
    name, login_id, password:pwd, role, dealer_id,
    dealer_name: dlr?.name||'',
    rl: role==='dealer_pic'?(dlr?.name||'All Dealers'):stRoleLabel(role),
    roleLabel: stRoleLabel(role),
  })
  closeStModal(); stReload()
  toast(`✅ User "${name}" created — can now login with ID: ${login_id}`,'#22c55e')
}

function deleteUser(id){
  if(passkeyGuard()) return
  if(S.user?.id===id){toast('⚠️ Cannot delete your own account','#f59e0b');return}
  const u=window.AUTH_USERS.find(x=>x.id===id); if(!u) return
  if(!confirm(`Delete user "${u.name}" (${u.login_id})?\n\nThey will no longer be able to login.`)) return
  window.AUTH_USERS=window.AUTH_USERS.filter(x=>x.id!==id)
  refreshUsersTable(); ST_DIRTY.mark('users')
  toast(`🗑️ User "${u.name}" deleted`,'#e11d48')
}

function refreshUsersTable(){
  const tbody=document.getElementById('users-tbody'); if(!tbody) return
  tbody.innerHTML=window.AUTH_USERS.map((u,i)=>userRow(u,i)).join('')
  const h2=tbody.closest('.card')?.querySelector('h2')

}

/* ═══════════════ CHART DATA LABELS PLUGIN ═══════════════ */
Chart.register({
  id: 'dtlabels',
  afterDatasetsDraw(chart) {
    const ctx = chart.ctx
    const type = chart.config.type
    const dsCount = chart.data.datasets[0]?.data?.length || 0

    chart.data.datasets.forEach((dataset, di) => {
      const meta = chart.getDatasetMeta(di)
      if(meta.hidden) return

      meta.data.forEach((element, index) => {
        const value = dataset.data[index]
        if(!value || value === 0) return
        const displayVal = value >= 1000 ? (value/1000).toFixed(1)+'k' : String(value)

        ctx.save()

        if(type === 'bar') {
          const {x, y, width, height} = element
          const barH = Math.abs(height || element.height || 0)
          const barW = Math.abs(width || element.width || 0)
          const isHorizontal = chart.options.indexAxis === 'y'
          const fontSize = Math.max(9, Math.min(12, isHorizontal ? barW*0.14 : barH*0.22))

          ctx.font = `700 ${fontSize}px Inter, sans-serif`
          ctx.textAlign = 'center'
          ctx.textBaseline = 'middle'

          if(isHorizontal) {
            const barLen = Math.abs(element.x - element.base)
            const numW = ctx.measureText(displayVal).width
            if(barLen > numW + 14) {
              ctx.fillStyle = 'rgba(255,255,255,0.95)'
              ctx.fillText(displayVal, element.base + barLen - numW/2 - 8, element.y)
            } else if(barLen > 5) {
              const color = Array.isArray(dataset.backgroundColor) ? dataset.backgroundColor[index] : (dataset.backgroundColor || '#374151')
              ctx.fillStyle = color
              ctx.textAlign = 'left'
              ctx.fillText(displayVal, element.x + 5, element.y)
            }
          } else {
            if(barH > 18) {
              ctx.fillStyle = 'rgba(255,255,255,0.95)'
              ctx.fillText(displayVal, x, y + barH/2)
            } else if(barH > 6) {
              const color = Array.isArray(dataset.backgroundColor) ? dataset.backgroundColor[index] : (dataset.backgroundColor || '#374151')
              ctx.fillStyle = color
              ctx.fillText(displayVal, x, y - 6)
            }
          }

        } else if((type === 'doughnut' || type === 'pie') && dsCount <= 6) {
          // Only draw labels inside donut if 6 or fewer segments (avoid clutter)
          const midAngle = (element.startAngle + element.endAngle) / 2
          const outerR = element.outerRadius
          const innerR = element.innerRadius || 0
          const midR = (outerR + innerR) / 2
          const textX = element.x + Math.cos(midAngle) * midR
          const textY = element.y + Math.sin(midAngle) * midR
          const segmentAngle = Math.abs(element.endAngle - element.startAngle)
          if(segmentAngle < 0.45) { ctx.restore(); return }

          const fontSize = Math.max(9, Math.min(13, midR * segmentAngle * 0.38))
          ctx.font = `700 ${fontSize}px Inter, sans-serif`
          ctx.textAlign = 'center'
          ctx.textBaseline = 'middle'
          ctx.fillStyle = 'rgba(255,255,255,0.95)'
          ctx.fillText(displayVal, textX, textY)
        }

        ctx.restore()
      })
    })
  }
})
